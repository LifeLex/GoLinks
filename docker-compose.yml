# Local development stack with Postgres. The `app` service is the GoLinks
# server connected to a Postgres-backed database. Goose runs migrations
# automatically on boot.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080
#
# To run against SQLite instead, drop the `db` service and set:
#   DATABASE_DRIVER=sqlite
#   DATABASE_URL=/app/data/golinks.db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: golinks
      POSTGRES_PASSWORD: golinks
      POSTGRES_DB: golinks
    ports:
      - "5432:5432"
    volumes:
      - golinks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golinks -d golinks"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_DRIVER: postgres
      DATABASE_URL: "postgres://golinks:golinks@db:5432/golinks?sslmode=disable"
      BASE_URL: "http://localhost:8080"
      ENVIRONMENT: development
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/app/docs

volumes:
  golinks-pgdata:
