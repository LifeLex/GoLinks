# Default values for the golinks chart.
# This is a YAML-formatted file. Override with `--set key=value` or `-f my-values.yaml`.

image:
  # PLACEHOLDER — you MUST override this with your own registry/image before install,
  # e.g. --set image.repository=ghcr.io/youruser/golinks
  repository: your-registry.example.com/golinks
  # Image tag. When empty, the chart uses .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling from a private registry, e.g. [{ name: regcred }].
imagePullSecrets: []

# GoLinks stores everything in a single SQLite file, which only one process can
# write. The app therefore CANNOT be horizontally scaled — the Deployment always
# renders replicas: 1 regardless of this value. It exists only so the NOTES output
# can warn you if you try to scale.
replicaCount: 1

strategy:
  # Recreate (NOT RollingUpdate): a rollout must fully terminate the old pod before
  # the new one starts, so two pods never contend for the ReadWriteOnce volume / the
  # SQLite write lock.
  type: Recreate

# Application configuration — surfaced to the container as environment variables.
config:
  # The public URL GoLinks runs behind. MUST match your Ingress host + scheme, because
  # the redirect handler builds "missing link" redirects from this value.
  baseUrl: "http://localhost:8080"
  environment: "production"
  logLevel: "info" # debug | info | warn | error
  port: 8080
  # SQLite file path — lives on the persistent volume (mounted at /app/data).
  databasePath: "/app/data/golinks.db"

persistence:
  enabled: true
  # Reuse an existing PVC instead of letting the chart create one. When set, the
  # chart will not render its own PersistentVolumeClaim.
  existingClaim: ""
  # "" uses the cluster's default StorageClass.
  storageClass: ""
  # SQLite is a single writer; ReadWriteOnce is the only sensible access mode.
  accessMode: ReadWriteOnce
  size: 1Gi
  # Keep the PVC (and its data) when the release is uninstalled, by annotating it
  # with helm.sh/resource-policy: keep. Recommended for a database. The trade-off:
  # the PVC is then orphaned on `helm uninstall` and must be deleted manually if
  # you really want the data gone. Ignored when existingClaim is set.
  retain: true
  # On first boot, copy the docs baked into the image (/app/docs) onto the volume so
  # the sample docs aren't masked by the mount. Idempotent — never clobbers uploads.
  seedDocs: true

# All probes hit GET /healthz (a 200 JSON endpoint that does no DB work). If you run
# an older image without that route, set healthPath to "/".
probes:
  healthPath: "/healthz"
  startup:
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

# The app's graceful shutdown budget is 30s; give the pod headroom beyond that.
terminationGracePeriodSeconds: 45

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  # cert-manager TLS: put the issuer here, e.g.
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  hosts:
    - host: golinks.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS hosts/secrets. cert-manager will create the named secret from the annotation
  # above. Example:
  #   - secretName: golinks-tls
  #     hosts:
  #       - golinks.example.com
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod-level security context. fsGroup is REQUIRED: the image runs as non-root UID 1001,
# and without an fsGroup the process cannot write the database or uploaded docs onto the
# mounted volume (the volume would be owned by root).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  # SQLite writes WAL/temp files next to the DB on the mounted volume; the root FS is
  # otherwise untouched. Left writable for simplicity — see README for hardening.
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
