apiVersion: v1
kind: Pod
metadata:
  name: {{ include "golinks.fullname" . }}-test-connection
  labels:
    {{- include "golinks.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - >-
          curl -sf
          http://{{ include "golinks.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.healthPath }}
